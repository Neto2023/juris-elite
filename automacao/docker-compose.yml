services:

  juris-postgres:
    image: postgres:16-alpine
    container_name: juris-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - juris_postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  juris-redis:
    image: redis:7-alpine
    container_name: juris-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - juris_redis_data:/data

  juris-evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: juris-evolution
    restart: unless-stopped
    # Publicado só no loopback: o QR code é acessado por túnel SSH, nunca pela internet.
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@juris-postgres:5432/${POSTGRES_DB}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_juris
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://juris-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution_juris
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
      DEL_INSTANCE: "false"
      # Dispara o webhook do agente a cada mensagem recebida.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://juris-agent:3001/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "false"
    depends_on:
      juris-postgres:
        condition: service_healthy
      juris-redis:
        condition: service_started

  juris-agent:
    build: .
    image: juris-agent:local
    container_name: juris-agent
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./assets:/app/assets:ro
    depends_on:
      juris-postgres:
        condition: service_healthy
    command: ["node", "src/server.js"]

volumes:
  juris_postgres_data:
  juris_redis_data:

networks:
  default:
    name: juris_network
